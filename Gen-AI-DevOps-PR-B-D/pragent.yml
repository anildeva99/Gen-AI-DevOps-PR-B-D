name: PR Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  merge_group: {}   # optional, good if you use merge queue

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for local diff if needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pr_agent/requirements.txt

      - name: Run PR Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY_JSON }}   # or better: OIDC federation
          VERTEX_PROJECT: ${{ secrets.VERTEX_PROJECT }}
          VERTEX_LOCATION: ${{ secrets.VERTEX_LOCATION }}
          RAG_ENDPOINT: ${{ secrets.RAG_ENDPOINT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python pr_agent/main.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --base "${{ github.base_ref }}" \
            --head "${{ github.head_ref }}"

