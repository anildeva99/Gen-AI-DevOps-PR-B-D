name: Day38 Full Pipeline

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:

  pr_review_and_slack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Slack – PR Triggered
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-type: application/json" \
          --data "{\"text\": \"🔥 *PR Triggered!* Branch: ${GITHUB_HEAD_REF}, Author: ${GITHUB_ACTOR}\"}" \
          "$SLACK_WEBHOOK"

  deploy_after_merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set GCP project
        run: gcloud config set project testadi-459816

      - name: Build with Cloud Build
        id: buildstep
        run: |
          cd Day38
          BUILD_OUTPUT=$(gcloud builds submit . --tag gcr.io/testadi-459816/day38-image:latest --async --quiet)
          echo "$BUILD_OUTPUT"

          # Extract Build ID from output
          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oE 'builds/[a-zA-Z0-9]+' | sed 's/builds\///')
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "BUILDS_URL=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=testadi-459816" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy day38-service \
            --image gcr.io/testadi-459816/day38-image:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated

      - name: Slack – Deployment Successful
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SERVICE_URL=$(gcloud run services describe day38-service --region us-central1 --format='value(status.url)')
          curl -X POST -H "Content-type: application/json" \
          --data "{\"text\": \"🎉 *Deployment Successful!*  
          🔗 *Service:* $SERVICE_URL  
          🏷️ *Commit:* ${GITHUB_SHA}  
          📄 *Cloud Build Logs:* ${BUILDS_URL}  
          \"}" \
          "$SLACK_WEBHOOK"

      - name: Slack – Deployment Failed
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-type: application/json" \
          --data "{\"text\": \"❌ *Deployment FAILED!*  
          🏷️ *Commit:* ${GITHUB_SHA}  
          📄 *Cloud Build Logs:* ${BUILDS_URL}  
          Please check GitHub Actions logs for details.\"}" \
          "$SLACK_WEBHOOK"

